name: Docker/Railway plumbing

# Fast, no-Docker-build checks for the containerized UVM-on-Verilator gate:
# shell syntax + shellcheck, the railway-watch PASS/FAIL classifier self-test, the
# entrypoint dispatch/resource-preflight logic (with a mocked make), and a
# `make -n railway-run` sanity check.  Runs on every push/PR — seconds, not
# minutes.  The heavy actual-image build lives in docker-image.yml.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  plumbing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install Railway TypeScript SDK
        run: npm install railway

      - name: Install Railway CLI
        run: npm install -g @railway/cli && railway --version

      - name: Verify Railway config plan
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "${RAILWAY_TOKEN:-}" ]; then
            railway config plan --out railway-plan.json
          else
            echo "RAILWAY_TOKEN is not set; skipping Railway config validation."
          fi

      - name: Plumbing checks (scripts + entrypoint dispatch + watcher self-test)
        run: make check-docker
