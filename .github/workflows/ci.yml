name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RTL tools (Icarus + Verilator + shellcheck)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog verilator shellcheck

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps (cocotb + pyuvm)
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'cocotb==1.9.2' 'pyuvm==4.0.1'

      - name: Tool versions
        run: |
          iverilog -V | head -1
          verilator --version
          python -c "import cocotb, pyuvm; print('cocotb', cocotb.__version__, 'pyuvm', pyuvm.__version__)"

      - name: Container & script plumbing checks
        run: make check-docker

      # lint (iverilog + Verilator) + PyUVM regression + Verilator coverage,
      # as a single pass/fail gate. The SV/UVM flow (make uvm) is not run here:
      # GitHub runners have no UVM-capable simulator, so it would only skip.
      - name: make ci
        run: make ci

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: sim/coverage.info
          if-no-files-found: ignore
